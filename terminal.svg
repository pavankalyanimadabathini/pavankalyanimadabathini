<svg width="1180" height="600" viewBox="0 0 1180 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="6" height="4" patternUnits="userSpaceOnUse">
      <rect width="6" height="1" fill="#22d3ee" opacity="0.055"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="1160" height="580" rx="18" fill="#0b1120" stroke="#22d3ee" stroke-width="2.5" filter="url(#glow)"/>

  <!-- title bar -->
  <circle cx="46" cy="46" r="7.5" fill="#ff5f57"/>
  <circle cx="72" cy="46" r="7.5" fill="#febc2e"/>
  <circle cx="98" cy="46" r="7.5" fill="#28c840"/>
  <text x="126" y="52" fill="#22d3ee" font-size="17" class="mono">pavan/README.md</text>

  <!-- tabs -->
  <g font-size="14" class="mono">
    <rect x="800" y="30" width="70" height="32" rx="8" fill="#164e63" filter="url(#softglow)"/>
    <text x="835" y="51" fill="#a5f3fc" text-anchor="middle">Code</text>
    <text x="905" y="51" fill="#5b6472" text-anchor="middle">Projects</text>
    <text x="1000" y="51" fill="#5b6472" text-anchor="middle">Experience</text>
    <text x="1105" y="51" fill="#5b6472" text-anchor="middle">Contact</text>
  </g>

  <line x1="28" y1="76" x2="1152" y2="76" stroke="#1e293b" stroke-width="1.5"/>

  <circle cx="1085" cy="112" r="6" fill="#4ade80" filter="url(#softglow)"/>
  <text x="1098" y="117" fill="#4ade80" font-size="14" class="mono">online</text>
  <g font-size="20" class="mono">
    <text x="80" y="140"><tspan fill="#4ade80">pavan@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#8b949e">$</tspan><tspan fill="#e6edf3"> ./profile.sh</tspan></text>

    <text x="80" y="182"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">name</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "Pavan Kalyan Imadabathini"</tspan></text>
    <text x="80" y="224"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">role</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "AI Engineer"</tspan><tspan fill="#8b949e"> + </tspan><tspan fill="#a3e635">"Project Manager"</tspan></text>
    <text x="80" y="266"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">company</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "Celeix Digital"</tspan></text>
    <text x="80" y="308"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">location</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "Greater Phoenix Area"</tspan></text>
    <text x="80" y="350"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">stack</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#8b949e"> [</tspan><tspan fill="#a3e635">"Python", "FastAPI", "Azure",</tspan></text>
    <text x="166" y="392"><tspan fill="#a3e635">"AWS", "PostgreSQL", "Power BI"</tspan><tspan fill="#8b949e">]</tspan></text>
    <text x="80" y="434"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">focus</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "systems that hold up in production"</tspan></text>
    <text x="80" y="476"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">writing</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#a3e635"> "AI for Builders, daily on LinkedIn"</tspan></text>
    <text x="80" y="518"><tspan fill="#22d3ee">&gt; </tspan><tspan fill="#7dd3fc">links</tspan><tspan fill="#5b6472">:</tspan><tspan fill="#67e8f9"> github</tspan><tspan fill="#5b6472"> |</tspan><tspan fill="#67e8f9"> linkedin</tspan><tspan fill="#5b6472"> |</tspan><tspan fill="#67e8f9"> portfolio</tspan><tspan fill="#5b6472"> |</tspan><tspan fill="#67e8f9"> newsletter</tspan></text>

    <text x="80" y="560"><tspan fill="#4ade80">pavan@github</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#8b949e">$</tspan></text>
    <rect x="258" y="542" width="12" height="24" fill="#4ade80" filter="url(#softglow)"/>
  </g>
</svg>
